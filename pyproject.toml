[project]
name = "train-tickets-tgbot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"

dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "dependency-injector>=4.49.1",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "psycopg-pool>=3.3.3",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.mypy]
exclude = 'tests/'

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["I001"]
